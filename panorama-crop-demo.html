<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全景图多视角裁切 Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f5f7fb;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      min-height: 100vh;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(360px, 1fr) auto;
      min-width: 0;
      padding: 20px;
      gap: 16px;
    }

    .topbar,
    .panel,
    .gallery {
      background: #fff;
      border: 1px solid #d9e2ef;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .upload {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #0f766e;
      font-weight: 650;
      cursor: pointer;
    }

    .upload input {
      display: none;
    }

    #viewer {
      min-height: 480px;
      overflow: hidden;
      background: #0f172a;
      border: 1px solid #cfd8e6;
      border-radius: 8px;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px 20px 20px 0;
    }

    .panel {
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 15px;
    }

    .field {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 58px;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      font-size: 13px;
    }

    .field input[type="range"] {
      width: 100%;
    }

    .field input[type="number"] {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid #cfd8e6;
      border-radius: 6px;
      font: inherit;
    }

    .value {
      color: #475569;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .select-field {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      color: #334155;
      font-size: 13px;
      font-weight: 650;
    }

    .select-field select {
      min-height: 38px;
      width: 100%;
      padding: 7px 8px;
      border: 1px solid #cfd8e6;
      border-radius: 6px;
      color: #1f2937;
      background: #fff;
      font: inherit;
    }

    button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid #0f766e;
      border-radius: 7px;
      color: #fff;
      background: #0f766e;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button.secondary {
      color: #0f766e;
      background: #fff;
    }

    button:disabled {
      color: #94a3b8;
      border-color: #cbd5e1;
      background: #e2e8f0;
      cursor: not-allowed;
    }

    .hint {
      margin: 10px 0 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    .gallery {
      min-height: 140px;
      padding: 16px;
    }

    .gallery h2 {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .result {
      overflow: hidden;
      border: 1px solid #d9e2ef;
      border-radius: 8px;
      background: #fff;
    }

    .result img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      background: #e2e8f0;
    }

    .result footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      font-size: 12px;
    }

    .result a {
      color: #0f766e;
      font-weight: 650;
      text-decoration: none;
    }

    .empty {
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .side {
        padding: 0 20px 20px;
      }

      #viewer {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="main">
      <header class="topbar">
        <h1>全景图多视角裁切 Demo</h1>
        <label class="upload">
          <span>上传全景图</span>
          <input id="fileInput" type="file" accept="image/*">
        </label>
      </header>

      <section id="viewer"></section>

      <section class="gallery">
        <h2>裁切结果</h2>
        <div id="results" class="result-grid">
          <div class="empty">上传一张 2:1 的 equirectangular 全景图后，可以导出当前视角，或批量生成 4/9/12 预设视角。</div>
        </div>
      </section>
    </main>

    <aside class="side">
      <section class="panel">
        <h2>当前视角</h2>
        <div class="field">
          <label for="yaw">Yaw</label>
          <input id="yaw" type="range" min="-180" max="180" step="1" value="0">
          <span id="yawValue" class="value">0 deg</span>
        </div>
        <div class="field">
          <label for="pitch">Pitch</label>
          <input id="pitch" type="range" min="-85" max="85" step="1" value="0">
          <span id="pitchValue" class="value">0 deg</span>
        </div>
        <div class="field">
          <label for="fov">FOV</label>
          <input id="fov" type="range" min="30" max="120" step="1" value="80">
          <span id="fovValue" class="value">80 deg</span>
        </div>
        <p class="hint">拖动预览区域会同步 yaw / pitch；也可以直接拖动滑块定位。</p>
      </section>

      <section class="panel">
        <h2>输出尺寸</h2>
        <div class="field">
          <label for="width">宽度</label>
          <input id="width" type="number" min="64" max="4096" step="1" value="1200">
          <span class="value">px</span>
        </div>
        <div class="field">
          <label for="height">高度</label>
          <input id="height" type="number" min="64" max="4096" step="1" value="800">
          <span class="value">px</span>
        </div>
        <label class="select-field" for="presetMode">
          <span>批量视角</span>
          <select id="presetMode">
            <option value="four">4 视角：前后左右</option>
            <option value="six">6 视角：前后左右上下</option>
            <option value="nine">9 视角：三行三列</option>
            <option value="twelve">12 视角：水平环拍</option>
          </select>
        </label>
        <p id="presetDescription" class="hint"></p>
        <div class="actions">
          <button id="captureCurrent" disabled>导出当前视角</button>
          <button id="capturePreset" class="secondary" disabled>批量导出选中视角</button>
          <button id="clearResults" class="secondary">清空结果</button>
        </div>
      </section>
    </aside>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js"
      }
    }
  </script>

  <script type="module" src="./panorama-crop-demo.js"></script>
</body>
</html>
